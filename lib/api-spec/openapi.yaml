openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification - Diputados Paraguay
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: legislative
    description: Legislative data (proxied from Paraguay Congress API)
  - name: ai
    description: AI legislative assistant
  - name: system
    description: Data freshness and sync status
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /legislative/dashboard:
    get:
      operationId: getDashboard
      tags: [legislative]
      summary: Get dashboard data
      description: Returns legislative dashboard statistics and recent activity
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardData"
        "503":
          description: Fuente oficial no disponible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataSourceError"

  /legislative/legisladores:
    get:
      operationId: getLegisladores
      tags: [legislative]
      summary: Get list of legislators
      parameters:
        - in: query
          name: partido
          schema:
            type: string
        - in: query
          name: departamento
          schema:
            type: string
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: List of legislators
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegisladoresResponse"
        "503":
          description: Fuente oficial no disponible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataSourceError"

  /legislative/legisladores/{id}:
    get:
      operationId: getLegisladorById
      tags: [legislative]
      summary: Get legislator by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Legislator detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Legislador"
        "503":
          description: Fuente oficial no disponible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataSourceError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /legislative/noticias:
    get:
      operationId: getNoticias
      tags: [legislative]
      summary: Get official Chamber of Deputies news
      responses:
        "200":
          description: List of official news items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoticiasResponse"
        "503":
          description: Fuente oficial no disponible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataSourceError"

  /legislative/comisiones:
    get:
      operationId: getComisiones
      tags: [legislative]
      summary: Get list of commissions
      responses:
        "200":
          description: List of commissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComisionesResponse"
        "503":
          description: Fuente oficial no disponible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataSourceError"

  /legislative/comisiones/{id}:
    get:
      operationId: getComisionById
      tags: [legislative]
      summary: Get commission by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Commission detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comision"
        "503":
          description: Fuente oficial no disponible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataSourceError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /legislative/sesiones:
    get:
      operationId: getSesiones
      tags: [legislative]
      summary: Get list of sessions
      parameters:
        - in: query
          name: estado
          schema:
            type: string
        - in: query
          name: tipo
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            default: 1
      responses:
        "200":
          description: List of sessions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SesionesResponse"
        "503":
          description: Fuente oficial no disponible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataSourceError"

  /legislative/sesiones/{id}:
    get:
      operationId: getSesionById
      tags: [legislative]
      summary: Get session by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Session detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sesion"
        "503":
          description: Fuente oficial no disponible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataSourceError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /legislative/proyectos:
    get:
      operationId: getProyectos
      tags: [legislative]
      summary: Get list of bills/projects
      parameters:
        - in: query
          name: estado
          schema:
            type: string
        - in: query
          name: comision
          schema:
            type: string
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: List of projects
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProyectosResponse"
        "503":
          description: Fuente oficial no disponible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataSourceError"

  /legislative/proyectos/{id}:
    get:
      operationId: getProyectoById
      tags: [legislative]
      summary: Get project by id
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Project detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Proyecto"
        "503":
          description: Fuente oficial no disponible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataSourceError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /legislative/leyes:
    get:
      operationId: getLeyes
      tags: [legislative]
      summary: Get list of approved laws
      parameters:
        - in: query
          name: anio
          schema:
            type: integer
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            default: 1
      responses:
        "200":
          description: List of laws
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeyesResponse"
        "503":
          description: Fuente oficial no disponible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataSourceError"

  /legislative/votaciones:
    get:
      operationId: getVotaciones
      tags: [legislative]
      summary: Get list of recent votes
      parameters:
        - in: query
          name: search
          schema:
            type: string
      responses:
        "200":
          description: List of votes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VotacionesResponse"
        "503":
          description: Fuente oficial no disponible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataSourceError"

  /legislative/votaciones/{id}:
    get:
      operationId: getVotacionById
      tags: [legislative]
      summary: Get vote by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Vote detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Votacion"
        "503":
          description: Fuente oficial no disponible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataSourceError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /system/status:
    get:
      operationId: getSystemStatus
      tags: [system]
      summary: Get data freshness / sync status
      description: Returns connectivity and last-sync freshness of official data sources
      responses:
        "200":
          description: System status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatus"
        "503":
          description: Fuente oficial no disponible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataSourceError"

  /ai/consult:
    post:
      operationId: aiConsult
      tags: [ai]
      summary: AI legislative assistant query
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AIConsultRequest"
      responses:
        "200":
          description: AI response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIConsultResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    SourceMeta:
      type: object
      description: >-
        Provenance metadata attached to every verified collection response.
        Guarantees the client can trace exactly which official source produced
        the data and when. verified is always true when present.
      properties:
        sourceUrl:
          type: string
          description: Exact official URL consulted for this result.
        fetchedAt:
          type: string
          format: date-time
          description: ISO-8601 timestamp of when the result was produced.
        verified:
          type: boolean
          description: Always true; the official source responded successfully.
      required:
        - sourceUrl
        - fetchedAt
        - verified

    DataSourceError:
      type: object
      description: >-
        Returned with HTTP 503 when the official source could not be verified.
        No mock, stale or fabricated data is ever served in its place.
      properties:
        error:
          type: string
          description: Human-readable error message (in Spanish).
        sourceUrl:
          type: string
          description: Official source that was unavailable.
        retryAfter:
          type: integer
          description: Suggested seconds to wait before retrying.
      required:
        - error
        - sourceUrl
        - retryAfter

    Legislador:
      type: object
      properties:
        id:
          type: string
        nombre:
          type: string
        apellido:
          type: string
        partido:
          type: string
        bancada:
          type: string
        departamento:
          type: string
        cargo:
          type: string
        periodo:
          type: string
        foto:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        bio:
          type: string
          nullable: true
        comisiones:
          type: array
          items:
            type: string
      required:
        - id
        - nombre
        - apellido
        - partido
        - bancada
        - departamento
        - cargo
        - periodo

    LegisladoresResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Legislador"
        total:
          type: integer
        page:
          type: integer
        totalPages:
          type: integer
        _meta:
          $ref: "#/components/schemas/SourceMeta"
      required:
        - data
        - total
        - page
        - totalPages
        - _meta

    Comision:
      type: object
      properties:
        id:
          type: string
        nombre:
          type: string
        tipo:
          type: string
        camara:
          type: string
        presidente:
          type: string
          nullable: true
        vicepresidente:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        miembros:
          type: array
          items:
            type: string
      required:
        - id
        - nombre
        - tipo
        - camara
        - miembros

    ComisionesResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Comision"
        total:
          type: integer
        _meta:
          $ref: "#/components/schemas/SourceMeta"
      required:
        - data
        - total
        - _meta

    Noticia:
      type: object
      properties:
        id:
          type: string
        titulo:
          type: string
        fecha:
          type: string
        resumen:
          type: string
        imagen:
          type: string
          nullable: true
        url:
          type: string
      required:
        - id
        - titulo
        - fecha
        - resumen
        - imagen
        - url

    NoticiasResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Noticia"
        total:
          type: integer
        _meta:
          $ref: "#/components/schemas/SourceMeta"
      required:
        - data
        - total
        - _meta

    Sesion:
      type: object
      properties:
        id:
          type: string
        fecha:
          type: string
        horaInicio:
          type: string
        horaFin:
          type: string
          nullable: true
        tipo:
          type: string
        estado:
          type: string
        periodo:
          type: string
        descripcion:
          type: string
          nullable: true
        orden_del_dia:
          type: array
          items:
            type: string
        appURL:
          type: string
          nullable: true
      required:
        - id
        - fecha
        - horaInicio
        - tipo
        - estado
        - periodo

    SesionesResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Sesion"
        total:
          type: integer
        sesionEnVivo:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Sesion"
        _meta:
          $ref: "#/components/schemas/SourceMeta"
      required:
        - data
        - total
        - _meta

    Proyecto:
      type: object
      properties:
        id:
          type: string
        numero:
          type: string
        titulo:
          type: string
        estado:
          type: string
        tipo:
          type: string
        etapa:
          type: string
        fechaIngreso:
          type: string
        iniciativa:
          type: string
        comision:
          type: string
          nullable: true
        descripcion:
          type: string
          nullable: true
        appURL:
          type: string
          nullable: true
        historial:
          type: array
          items:
            type: object
            properties:
              fecha:
                type: string
              evento:
                type: string
              descripcion:
                type: string
            required:
              - fecha
              - evento
              - descripcion
      required:
        - id
        - numero
        - titulo
        - estado
        - tipo
        - etapa
        - fechaIngreso
        - iniciativa

    ProyectosResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Proyecto"
        total:
          type: integer
        page:
          type: integer
        totalPages:
          type: integer
        _meta:
          $ref: "#/components/schemas/SourceMeta"
      required:
        - data
        - total
        - page
        - totalPages
        - _meta

    Ley:
      type: object
      properties:
        numero:
          type: string
        titulo:
          type: string
        fechaSancion:
          type: string
        fechaPromulgacion:
          type: string
          nullable: true
        proyecto:
          type: string
          nullable: true
      required:
        - numero
        - titulo
        - fechaSancion

    LeyesResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Ley"
        total:
          type: integer
        page:
          type: integer
        totalPages:
          type: integer
        _meta:
          $ref: "#/components/schemas/SourceMeta"
      required:
        - data
        - total
        - page
        - totalPages
        - _meta

    DashboardData:
      type: object
      properties:
        totalLegisladores:
          type: integer
        totalComisiones:
          type: integer
        sesionesEsteMes:
          type: integer
        proyectosHistoricos:
          type: integer
        leyesAprobadas:
          type: integer
        sesionEnVivo:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Sesion"
        proximasSesiones:
          type: array
          items:
            $ref: "#/components/schemas/Sesion"
        ultimosProyectos:
          type: array
          items:
            $ref: "#/components/schemas/Proyecto"
        ultimasLeyes:
          type: array
          items:
            $ref: "#/components/schemas/Ley"
        _meta:
          $ref: "#/components/schemas/SourceMeta"
      required:
        - totalLegisladores
        - totalComisiones
        - sesionesEsteMes
        - proyectosHistoricos
        - leyesAprobadas
        - proximasSesiones
        - ultimosProyectos
        - ultimasLeyes
        - _meta

    Votacion:
      type: object
      properties:
        id:
          type: string
        titulo:
          type: string
        descripcion:
          type: string
        fecha:
          type: string
        tipo:
          type: string
        camara:
          type: string
        favor:
          type: integer
        contra:
          type: integer
        abstenciones:
          type: integer
        ausentes:
          type: integer
        resultado:
          type: string
        appURL:
          type: string
          nullable: true
        proyectoId:
          type: string
          nullable: true
        votos:
          type: array
          items:
            type: object
            properties:
              legislador:
                type: string
              partido:
                type: string
              sentido:
                type: string
            required:
              - legislador
              - partido
              - sentido
      required:
        - id
        - titulo
        - descripcion
        - fecha
        - tipo
        - camara
        - favor
        - contra
        - abstenciones
        - ausentes
        - resultado

    VotacionesResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Votacion"
        total:
          type: integer
        _meta:
          $ref: "#/components/schemas/SourceMeta"
      required:
        - data
        - total
        - _meta

    SystemStatus:
      type: object
      properties:
        lastSync:
          type: string
          nullable: true
        source:
          type: string
        recordsUpdated:
          type: integer
        lastSessionDetected:
          type: string
          nullable: true
        dataFreshness:
          type: string
        status:
          type: string
        recursos:
          type: array
          items:
            type: object
            properties:
              recurso:
                type: string
              lastSync:
                type: string
                nullable: true
              recordsUpdated:
                type: integer
              dataFreshness:
                type: string
              status:
                type: string
            required:
              - recurso
              - recordsUpdated
              - dataFreshness
              - status
      required:
        - source
        - recordsUpdated
        - dataFreshness
        - status
        - recursos

    AIConsultRequest:
      type: object
      properties:
        pregunta:
          type: string
        historial:
          type: array
          items:
            type: object
            properties:
              role:
                type: string
              content:
                type: string
            required:
              - role
              - content
      required:
        - pregunta

    AIConsultResponse:
      type: object
      properties:
        respuesta:
          type: string
        tipo:
          type: string
        datos:
          nullable: true
        fuentes:
          type: array
          items:
            type: string
      required:
        - respuesta
        - tipo
        - fuentes
